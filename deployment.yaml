apiVersion: apps/v1
kind: Deployment
metadata: 
  name: demoapp 
spec: 
  replicas: 1 
  selector: 
    matchLabels: 
          app: demoapp 
  template: 
    metadata: 
       labels: 
         app: demoapp 
    spec: 
      containers: 
         - name: demoapp 
           image: acrpracticedevang.azurecr.io/demoapp:v1 
           ports: 
             - containerPort: 80